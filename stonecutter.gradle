// Loom's Java 25 game merger inherits ASM from this parent classloader.
buildscript {
    dependencies {
        classpath 'org.ow2.asm:asm:9.11'
        classpath 'org.ow2.asm:asm-tree:9.11'
        classpath 'org.ow2.asm:asm-commons:9.11'
        classpath 'org.ow2.asm:asm-util:9.11'
    }
}

plugins {
    id 'dev.kikugie.stonecutter'
}

stonecutter.active '26.1.2-fabric'

def matrixTargets = fileTree('gradle/matrix') { include '*.properties' }.files.sort { it.name }
        .collect { it.name - '.properties' }

tasks.register('compileMatrix') {
    group = 'verification'
    description = 'Compiles every supported Minecraft-version and loader combination.'
    dependsOn matrixTargets.collect { ":${it}:compileJava" }
}

tasks.register('packageMatrix') {
    group = 'build'
    description = 'Builds the installable artifact for every matrix target.'
    dependsOn matrixTargets.collect { ":${it}:packageTarget" }
}

tasks.register('verifyServerLaunchSetup') {
    group = 'verification'
    description = 'Generates every dedicated-server launch configuration without starting Minecraft.'
    dependsOn matrixTargets.collect { ":${it}:configureLaunch" }
}

tasks.register('verifyMatrix') {
    group = 'verification'
    description = 'Runs compilation, packaging, and server launch setup for the complete matrix.'
    dependsOn 'compileMatrix', 'packageMatrix', 'verifyServerLaunchSetup'
}
